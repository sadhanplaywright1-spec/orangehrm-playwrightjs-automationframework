name: CI/CD Pipeline
on:
push:
branches:
- main
- master
- develop
- staging
pull_request:
branches:
- main
- master
- develop
- staging
env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
ui-tests:
name: UI Tests
runs-on: windows-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
-name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 24
cache: npm
-name: Install dependencies
run: npm ci
-name: Install Playwright Browsers
run: npx playwright install chromium
-name: Run UI Tests
run: npx playwright test tests/ui --reporter=line,allure-playwright
-name: Install Allure CLI
if: always()
run: npm install -g allure-commandline --save-dev
-name: Generate Allure Report
if: always()
run: allure generate allure-results --clean -o allure-report
-name: Upload Allure Report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-report-ui
path: allure-report
api-tests:
name: API Tests
runs-on: windows-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
-name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 24
cache: npm
-name: Install dependencies
run: npm ci
-name: Install Playwright Browsers
run: npx playwright install chromium
-name: Run API Tests
run: npx playwright test tests/api --reporter=line,allure-playwright
-name: Install Allure CLI
if: always()
run: npm install -g allure-commandline --save-dev
-name: Generate Allure Report
if: always()
run: allure generate allure-results --clean -o allure-report
-name: Upload Allure Report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-report-api
path: allure-report
coverage:
name: Full Regression
runs-on: windows-latest
needs:
- ui-tests
- api-tests
if: |
github.ref == 'refs/heads/main' ||
github.ref == 'refs/heads/master'
steps:
- name: Checkout code
uses: actions/checkout@v4
-name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 24
cache: npm
-name: Install dependencies
run: npm ci
-name: Install Playwright Browsers
run: npx playwright install chromium
-name: Run Full Suite
run: npx playwright test tests/ui tests/api --reporter=line,allure-playwright
-name: Install Allure CLI
if: always()
run: npm install -g allure-commandline --save-dev
-name: Generate Allure Report
if: always()
run: allure generate allure-results --clean -o allure-report
-name: Upload Allure Report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-report-full
path: allure-report