name: OrangeHRM Playwright CI
on:
push:
branches:
- main
- develop
pull_request:
branches:
- main
- develop
jobs:
playwright-tests:
runs-on: ubuntu-latest
strategy:
fail-fast: false
matrix:
suite:
- ui
- api
environment:
- qa
- uat
- staging
steps:
- name: Checkout Repository
uses: actions/checkout@v4
-name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20
-name: Install Dependencies
run: npm ci
-name: Install Playwright Browsers
run: npx playwright install --with-deps
-name: Execute UI Tests
if: matrix.suite == 'ui'
run: |
 npx playwright test --config=playwright.ui.config.js --project=${{ matrix.environment }}
-name:  Execute API Tests
if: matrix.suite == 'api'
-name: Execute API Tests
if: matrix.suite == 'api'
run: npx playwright test --config=playwright.api.config.js --project=${{ matrix.environment }}
-name: Upload Allure Results
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-results-${{ matrix.suite }}-${{ matrix.environment }}
path: allure-results
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-results-${{ matrix.suite }}-${{ matrix.environment }}
path: allure-results
-name: Generate Allure Report
if: always()
run: |
 npx allure-commandline generate allure-results 
 --clean -o allure-report
-name: Upload Allure Report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-report-${{ matrix.suite }}-${{ matrix.environment }}
path: allure-report
