name: Playwright CI
on:
  push:
    branches:
      - main
      - master
      - qa
      - staging
      - uat
  pull_request:
    branches:
      - main
      - master
      - qa
      - staging 
workflow_dispatch:
env:
CI: true
NODE_VERSION: "24"
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: ${{ env.NODE_VERSION }}
cache: npm
-name: Install dependencies
run: npm ci
-name: Install Playwright browsers
run: npx playwright install --with-deps chromium
-name: Run UI tests
run: npx playwright test tests/ui --reporter=line,allure-playwright
-name: Generate Allure report
 if:always()
run: npx allure generate allure-results --clean -o allure-report
-name: Upload Allure report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-report
path: allure-report
api-tests:
    runs-on: ubuntu-latest
    needs: ui-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
node-version: ${{ env.NODE_VERSION }}
cache: npm
-name:Install dependencies
run: npm ci
-name: Install Playwright browsers
run: npx playwright install --with-deps chromium
-name: Run API tests
run: npx playwright test tests/api --reporter=line,allure-playwright=
-name: Generate Allure report
if: always()
run:npx allure generate allure-results --clean -o allure-report
- name: Upload Allure report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-report-api
path: allure-report
coverage:
name: Full Regression Coverage
runs-on: 
    ubuntu-latest
needs: [ui-tests, api-tests]
if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
   
steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
node-version: ${{ env.NODE_VERSION }}
cache: npm
-name: Install dependencies
run: npm ci
-name: Install Playwright browsers
run: npx playwright install --with-deps chromium
-name: Run Full Regression Suite
run: npx playwright test tests/ui tests/api --coverage --reporter=line,allure-playwright
-name: Upload Regression Report
run: npx nyc report --reporter=text-summary --reporter=lcov --report-dir coverage
-name: regression-report
uses: actions/upload-artifact@v4
with:
name: coverage-report
path: coverage

