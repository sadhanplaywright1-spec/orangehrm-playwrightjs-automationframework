name: Playwright CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  ui-tests:
    name: UI - ${{ matrix.project }}
    runs-on: windows-latest
    env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    CI: true
    strategy:
      fail-fast: false
      matrix:
        project:
          - QA-chromium
          - QA-firefox
          - QA-webkit
          - UAT-chromium
          - UAT-firefox
          - UAT-webkit
          - STAGING-chromium
          - STAGING-firefox
          - STAGING-webkit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run UI Tests
        run: |
          npx playwright test `
            --config=playwright.ui.config.js `
            --project="${{ matrix.project }}"
      - name: Upload UI Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui-${{ matrix.project }}
          path: allure-results
  api-tests:
    name: API - ${{ matrix.environment }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - QA
          - UAT
          - STAGING
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run API Tests
        run: |
          npx playwright test `
            --config=playwright.api.config.js `
            --project="${{ matrix.environment }}"
      - name: Upload API Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-${{ matrix.environment }}
          path: allure-results
  allure-report:
    name: Generate Combined Allure Report
    runs-on: windows-latest
    needs:
      - ui-tests
      - api-tests
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Allure Commandline
        run: npm install -g allure-commandline
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Allure Results Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path allure-results
      - name: Merge Allure Results
        shell: pwsh
        run: |
          Get-ChildItem -Path artifacts -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName -Destination allure-results -Force
          }
      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report
      - name: Upload Final Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: final-allure-report
          path: allure-report