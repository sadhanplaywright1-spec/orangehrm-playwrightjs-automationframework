name: OrangeHRM Playwright CI
on:
workflow_dispatch:
push:
branches:
- main
- develop
jobs:
playwright:
runs-on: ubuntu-latest
strategy:
fail-fast: false
matrix:
suite:
- ui
- api
environment:
- QA
- UAT
- STAGING
name: ${{ matrix.suite }}-${{ matrix.environment }}
steps:
- name: Checkout Repository
uses: actions/checkout@v4
-name: Setup NodeJS
uses: actions/setup-node@v4
with:
node-version: 20
-name: Install Dependencies
run: npm ci
-name: Install Playwright Browsers
run: npx playwright install --with-deps
-name: Install Allure Commandline
run: npm install -g allure-commandline
-name: Execute UI Tests
if: matrix.suite == 'ui'
run: |  
npx playwright test                                                                                  
\--config=playwright.ui.config.js \--project=${{ matrix.environment }}
- name: Execute API Tests
if: matrix.suite == 'api'
run: |
npx playwright test \--config=playwright.api.config.js \ --project=${{ matrix.environment }}
- name: Generate Allure Report
if: always()
run: |
allure generate allure-results --clean -o allure-report
-name: Upload Allure Report
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-${{ matrix.suite }}-${{ matrix.environment }}
path: allure-report
-name: Upload Playwright Reports
if: always()
uses: actions/upload-artifact@v4
with:
name: playwright-${{ matrix.suite }}-${{ matrix.environment }}
path: |
playwright-report
api-playwright-report
notify:
needs: playwright
runs-on: ubuntu-latest
if: always()
steps:
- name: Send Email
uses: dawidd6/action-send-mail@v3
with:
server_address: smtp.gmail.com
server_port: 465
secure: true
username: ${{ secrets.MAIL_USERNAME }}
password: ${{ secrets.MAIL_PASSWORD }}
subject: |
OrangeHRM Automation Execution Result
to: ${{ secrets.MAIL_TO }}
from: GitHub Actions
body: | 
Automation execution completed.
Repository: ${{ github.repository }}
Branch: ${{ github.ref_name }}
Workflow: ${{ github.workflow }}
Status: ${{ needs.playwright.result}}
Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id}}