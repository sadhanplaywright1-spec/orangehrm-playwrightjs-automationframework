name: Playwright CI
env:
ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
on:
  push:
    branches:
      - main
      - master
      - qa
      - staging
      - uat
  pull_request:
    branches:
      - main
      - master
      - qa
      - staging
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
        node-version: 20
        cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        run: npx playwright test tests/ui --reporter=line,allure-playwright
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
  api-tests:
    runs-on: ubuntu-latest
    needs: ui-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run API tests
        run: npx playwright test tests/api --reporter=line,allure-playwright=
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report
  coverage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [ui-tests, api-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run full coverage suite
        run: npx playwright test tests/ui tests/api --coverage --reporter=line,allure-playwright
      - name: Create coverage summary
        run: npx nyc report --reporter=text-summary --reporter=lcov --report-dir coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

