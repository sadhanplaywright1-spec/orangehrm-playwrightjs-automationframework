name: Playwright CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  ui-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        - env: QA
          browser: chromium
        - env: QA
          browser: firefox
        - env: QA
          browser: webkit
        - env: UAT
          browser: chromium
        - env: UAT
          browser: firefox
        - env: UAT
          browser: webkit
        - env: STAGING
          browser: chromium
        - env: STAGING
          browser: firefox
        - env: STAGING
name: UI-${{ matrix.env }}-${{ matrix.browser }}
env:
      TEST_ENV: ${{ matrix.env }}
CI: true
steps:
- name: Checkout Repository
  uses: actions/checkout@v4
- name: Setup Node
  uses: actions/setup-node@v4
with:
        node-version: 24
-name: Install Dependencies
run: npm ci
-name: Install Browsers
run: npx playwright install
-name: Run UI Tests
shell: pwsh
run: |
       npx playwright test `
       --config=playwright.ui.config.js `
       --project=${{ matrix.browser }}
-name: Upload UI Allure Results
        if:always()
        uses:actions/upload-artifact@v4
with:
          name:allure-ui-${{ matrix.env }}-${{ matrix.browser }}
          path:allure-results

api-tests:
   name: API-${{ matrix.env }}
   runs-on: windows-latest
   strategy:
   concurrency: fail-fast: false
matrix:
env: [QA, UAT, STAGING]
env:
TEST_ENV: ${{ matrix.env }}
CI: true
steps:
- name: Checkout Repository
  uses: actions/checkout@v4
- name: Setup Node
  uses: actions/setup-node@v4
with:
       node-version: 24
-name: Install Dependencies
run: npm ci
-name: Install Browsers
run: npx playwright install
-name: Run API Tests
shell: pwsh
run: |
  npx playwright test 
  --config=playwright.api.config.js
-name: Upload API Allure Results
if: always()
uses: actions/upload-artifact@v4
with:
name: allure-api-${{ matrix.env }}
path: allure-results
allure-report:
runs-on: windows-latest
needs:
 -ui-tests
 -api-tests
if: always()
steps:
- name: Checkout Repository
uses: actions/checkout@v4
-name: Setup Node
uses: actions/setup-node@v4
with:
node-version: 24
-name: Install Allure
run: npm install -g allure-commandline
-name: Download All Artifacts
uses: actions/download-artifact@v4
with:
path: artifacts
-name: Create Allure Results Folder
shell: pwsh
run: |
 New-Item -ItemType Directory -Force -Path allure-results
-name: Merge Allure Results
shell: pwsh
run: |
   Get-ChildItem artifacts -Recurse -File | ForEach-Object {
   Copy-Item $_.FullName allure-results -Force
   }
-name: Generate Allure Report
run: allure generate allure-results --clean -o allure-report
-name: Upload Allure Report
uses: actions/upload-artifact@v4
with:
name: final-allure-report
path: allure-report
